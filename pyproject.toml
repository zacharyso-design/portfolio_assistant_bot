[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "chio-portfolio-assistant"
version = "1.0.0"
description = "Local, cited project knowledge and portfolio assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "pypdf==6.0.0",
  "extract-msg==0.54.1",
  "beautifulsoup4==4.13.5",
]

[project.scripts]
portfolio-assistant = "portfolio_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["portfolio_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
