[app]
database_path = "%LOCALAPPDATA%\\PortfolioAssistant\\portfolio.db"
one_drive_root = "C:\\Users\\USER\\OneDrive - Organization\\CHIO Portfolio"
bind_host = "127.0.0.1"
bind_port = 8765
# Maximum total bytes across one upload or folder ingestion selection.
max_file_mb = 100
max_attachments = 25
max_extracted_text_mb = 5
daily_run_time = "06:00"
worker_poll_seconds = 2
automatic_ai_attempts = 2

[llm]
adapter = "internal"
base_url = "https://api.genai.mil"
chat_path = "/v1/chat/completions"
# Confirm against the live catalog in Settings; the values below are the
# models GenAI.mil actually served as of August 2026.
model = "gemini-3.7-flash"
judgment_model = "gemini-3.7-flash"
api_key_env = "GENAI_API_KEY"
auth_header = "Authorization"
auth_scheme = "Bearer"
ca_bundle = ""
timeout_seconds = 240
max_tokens = 32000
# At most 3 total attempts, including corrective JSON and transient retries.
max_attempts = 3
# Set requests to 0 to disable the process-wide sliding-window limiter.
rate_limit_requests = 120
rate_limit_window_seconds = 60
max_evidence_chars = 30000

# Optional: mirror the diagnostic log to a PRIVATE GitHub repository so it
# can be reviewed without copying files off this machine. Leave repo empty to
# disable. Create a fine-grained personal access token restricted to ONLY the
# private diagnostics repository with Contents read/write, and store it in
# the environment variable named by token_env (setx, then open a new
# terminal). The log tail is pushed to logs/<hostname>/assistant.log whenever
# it changes, at most once per publish interval.
# [diagnostics]
# repo = "zacharyso-design/portfolio-assistant-diagnostics"
# token_env = "PORTFOLIO_ASSISTANT_DIAGNOSTICS_TOKEN"
# publish_interval_seconds = 300
